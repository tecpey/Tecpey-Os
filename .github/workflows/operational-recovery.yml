name: Scheduled Operational Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - scripts/test-container-volume-recovery.sh
      - scripts/verify-operational-recovery-evidence.mjs
      - scripts/check-operational-recovery-authority.mjs
      - scripts/operational-recovery-authority-policy.mjs
      - scripts/operational-recovery-authority-policy.test.mjs
      - scripts/operational-recovery-evidence.test.mjs
      - docs/operations/OPERATIONAL_RECOVERY_DRILLS.md
      - docs/operations/PRODUCTION_DEPLOYMENT_CONTRACT.md
      - .github/workflows/operational-recovery.yml
      - .github/workflows/container-supply-chain.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    name: PostgreSQL and Redis restore with RPO/RTO evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify recovery authority
        run: npm run test:ops-recovery-authority

      - name: Build exact migration image
        env:
          RECOVERY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --target runner --tag "tecpey-recovery:$RECOVERY_SHA" .

      - name: Execute isolated PostgreSQL and Redis restore
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECOVERY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TECPEY_RECOVERY_RTO_SECONDS: '300'
        run: bash scripts/test-container-volume-recovery.sh "tecpey-recovery:$RECOVERY_SHA"

      - name: Upload bounded recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operational-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/container-recovery/**
          if-no-files-found: error
          retention-days: 30
