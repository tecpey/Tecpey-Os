name: Full History Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Exact-head full-history Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source and full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Verify permanent secret-scanning authority
        run: npm run security:secrets:check

      - name: Run secret-scanning policy tests
        run: npm run test:secret-scanning

      - name: Scan all reachable Git history
        env:
          TECPEY_SECRET_SCAN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TECPEY_SECRET_SCAN_ARTIFACT_DIR: artifacts/secret-scanning
        run: bash scripts/run-secret-scan.sh

      - name: Upload redacted immutable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: secret-scanning-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/secret-scanning/**
          if-no-files-found: error
          retention-days: 30
