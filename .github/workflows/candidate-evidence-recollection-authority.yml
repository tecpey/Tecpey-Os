name: Candidate Evidence Recollection Authority

on:
  pull_request:
    branches: [main]
    paths:
      - docs/launch/generated/candidate-evidence-recollection-request-*.json
      - docs/launch/generated/candidate-promotion-state-*.json
      - docs/launch/generated/exact-head-workflow-evidence-*.json
      - docs/launch/generated/current-controlled-launch-candidate.json
      - docs/launch/generated/protected-staging-no-go-register-*.json
      - docs/launch/PROTECTED_STAGING_EVIDENCE_PACKET_*.md
      - docs/launch/CONTROLLED_SOFT_LAUNCH_GO_NO_GO_CHECKLIST.md
      - package.json
      - scripts/candidate-evidence-recollection-policy.mjs
      - scripts/candidate-evidence-recollection-policy.test.mjs
      - scripts/check-candidate-evidence-recollection-authority.mjs
      - scripts/exact-head-workflow-evidence-policy.mjs
      - scripts/exact-head-workflow-evidence-policy.test.mjs
      - scripts/exact-head-workflow-evidence-origin.mjs
      - scripts/exact-head-workflow-evidence-origin.test.mjs
      - scripts/check-exact-head-workflow-evidence-authority.mjs
      - scripts/prepare-trusted-exact-head-evidence-overlay.mjs
      - scripts/prepare-trusted-exact-head-evidence-overlay.test.mjs
      - scripts/check-controlled-launch-candidate-lineage.mjs
      - .github/workflows/candidate-evidence-recollection-authority.yml
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-evidence-recollection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Fail-closed exact-candidate recollection contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Mutation-test recollection and exact-head evidence authorities
        run: >-
          node --test
          scripts/candidate-evidence-recollection-policy.test.mjs
          scripts/exact-head-workflow-evidence-policy.test.mjs
          scripts/exact-head-workflow-evidence-origin.test.mjs
          scripts/prepare-trusted-exact-head-evidence-overlay.test.mjs

      - name: Verify current recollection contract
        run: node scripts/check-candidate-evidence-recollection-authority.mjs

      - name: Verify current exact-head evidence authority
        env:
          TECPEY_EXACT_HEAD_ORIGIN_VERIFICATION: static-only
        run: node scripts/check-exact-head-workflow-evidence-authority.mjs

      - name: Verify current exact-head evidence origin on main
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-exact-head-workflow-evidence-authority.mjs

      - name: Prepare trusted-main exact-head evidence overlay on PR
        if: github.event_name == 'pull_request'
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git init ../trusted-source
          git -C ../trusted-source remote add origin "https://github.com/${{ github.repository }}.git"
          git -C ../trusted-source fetch --no-tags --depth=1 origin "$TRUSTED_BASE_SHA"
          git -C ../trusted-source checkout --detach FETCH_HEAD
          test "$(git -C ../trusted-source rev-parse HEAD)" = "$TRUSTED_BASE_SHA"
          node scripts/prepare-trusted-exact-head-evidence-overlay.mjs --trusted-root ../trusted-source

      - name: Verify current exact-head evidence origin from trusted main on PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git -C ../trusted-source diff --exit-code HEAD -- \
            scripts/check-exact-head-workflow-evidence-authority.mjs \
            scripts/exact-head-workflow-evidence-policy.mjs \
            scripts/exact-head-workflow-evidence-origin.mjs
          cd ../trusted-source
          node scripts/check-exact-head-workflow-evidence-authority.mjs

  evidence-discovery:
    name: Governed exact-main evidence discovery
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Discover governed runs and dispatch exact-main operational recovery if missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";

          const request = JSON.parse(
            await readFile("docs/launch/generated/candidate-evidence-recollection-request-20260821.json", "utf8"),
          );
          const selectedSha = process.env.EVENT_NAME === "push" ? process.env.PUSH_SHA : request.selectedSha;
          const repository = process.env.REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const api = "https://api.github.com";
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "tecpey-exact-main-evidence-discovery",
          };

          async function gh(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers ?? {}) },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`${options.method ?? "GET"} ${path} failed: ${response.status} ${body}`);
            }
            if (response.status === 204) return null;
            return response.json();
          }

          const branch = await gh(`/repos/${repository}/branches/main`);
          if (branch.commit?.sha !== selectedSha) {
            throw new Error(`main drifted: expected ${selectedSha}, got ${branch.commit?.sha}`);
          }

          const contract = new Map([
            ["CI", { path: ".github/workflows/ci.yml", event: "push" }],
            ["Full Suite Diagnostics", { path: ".github/workflows/full-suite-diagnostics.yml", event: "push" }],
            ["API Security Manifest", { path: ".github/workflows/api-security-manifest.yml", event: "push" }],
            ["Sensitive Mutation Audit", { path: ".github/workflows/sensitive-mutation-audit.yml", event: "push" }],
            ["Repository Audit Manifest", { path: ".github/workflows/repository-audit-manifest.yml", event: "push" }],
            ["Public Browser Golden Path", { path: ".github/workflows/public-browser-golden-path.yml", event: "push" }],
            ["Container Supply Chain", { path: ".github/workflows/container-supply-chain.yml", event: "push" }],
            ["Full History Secret Scanning", { path: ".github/workflows/secret-scanning.yml", event: "push" }],
            ["Scheduled Operational Recovery", { path: ".github/workflows/operational-recovery.yml", event: "workflow_dispatch" }],
          ]);

          async function listRuns() {
            const page = await gh(
              `/repos/${repository}/actions/runs?head_sha=${encodeURIComponent(selectedSha)}&per_page=100`,
            );
            return page.workflow_runs ?? [];
          }

          function matchingRuns(allRuns, name, expected) {
            return allRuns
              .filter(
                (run) =>
                  run.name === name &&
                  run.path === expected.path &&
                  run.event === expected.event &&
                  run.head_sha === selectedSha &&
                  run.head_branch === "main",
              )
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          }

          let allRuns = await listRuns();
          const recoveryContract = contract.get("Scheduled Operational Recovery");
          let recovery = matchingRuns(allRuns, "Scheduled Operational Recovery", recoveryContract)[0] ?? null;
          let dispatchedRecovery = false;

          if (!recovery) {
            await gh(`/repos/${repository}/actions/workflows/operational-recovery.yml/dispatches`, {
              method: "POST",
              body: JSON.stringify({ ref: "main" }),
              headers: { "Content-Type": "application/json" },
            });
            dispatchedRecovery = true;
          }

          let selectedRuns = [];
          let allComplete = false;
          for (let attempt = 0; attempt < 144 && !allComplete; attempt += 1) {
            if (attempt > 0) await new Promise((resolve) => setTimeout(resolve, 5000));
            allRuns = await listRuns();
            selectedRuns = [...contract].map(([name, expected]) => {
              const matches = matchingRuns(allRuns, name, expected);
              const run = matches[0] ?? null;
              return { name, expected, matches, run };
            });
            allComplete = selectedRuns.every(
              ({ run }) => run?.status === "completed" && typeof run?.conclusion === "string",
            );
          }

          const missing = selectedRuns.filter(({ run }) => !run).map(({ name }) => name);
          if (missing.length > 0) {
            throw new Error(`missing exact-main governed workflow runs: ${missing.join(", ")}`);
          }
          const unfinished = selectedRuns
            .filter(({ run }) => run.status !== "completed")
            .map(({ name, run }) => `${name}:${run.status}`);
          if (unfinished.length > 0) {
            throw new Error(`exact-main governed workflows did not complete in time: ${unfinished.join(", ")}`);
          }
          const unsuccessful = selectedRuns
            .filter(({ run }) => run.conclusion !== "success")
            .map(({ name, run }) => `${name}:${run.conclusion}`);
          if (unsuccessful.length > 0) {
            throw new Error(`exact-main governed workflows were not successful: ${unsuccessful.join(", ")}`);
          }

          const normalizedRuns = selectedRuns.map(({ name, expected, matches, run }) => ({
            name,
            expectedPath: expected.path,
            expectedEvent: expected.event,
            matchCount: matches.length,
            run: {
              id: run.id,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              workflowPath: run.path,
              headSha: run.head_sha,
              headBranch: run.head_branch,
              runUrl: run.html_url,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
            },
          }));

          const container = normalizedRuns.find((entry) => entry.name === "Container Supply Chain")?.run;
          const recoveryRun = normalizedRuns.find((entry) => entry.name === "Scheduled Operational Recovery")?.run;

          const containerArtifactsPage = await gh(
            `/repos/${repository}/actions/runs/${container.id}/artifacts?per_page=100`,
          );
          const containerJobsPage = await gh(`/repos/${repository}/actions/runs/${container.id}/jobs?per_page=100`);
          const recoveryArtifactsPage = await gh(
            `/repos/${repository}/actions/runs/${recoveryRun.id}/artifacts?per_page=100`,
          );
          const recoveryJobsPage = await gh(`/repos/${repository}/actions/runs/${recoveryRun.id}/jobs?per_page=100`);

          const normalizeArtifacts = (artifacts) =>
            artifacts.map((artifact) => ({
              id: artifact.id,
              name: artifact.name,
              sizeInBytes: artifact.size_in_bytes,
              expired: artifact.expired,
              createdAt: artifact.created_at,
              expiresAt: artifact.expires_at,
              digest: artifact.digest ?? null,
            }));
          const normalizeJobs = (jobs) =>
            jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              startedAt: job.started_at,
              completedAt: job.completed_at,
            }));

          const output = {
            schemaVersion: 1,
            evidenceClass: "governed-exact-main-run-discovery",
            selectedSha,
            verifiedMainHead: branch.commit.sha,
            sourceEvent: process.env.EVENT_NAME,
            dispatchedRecovery,
            generatedAt: new Date().toISOString(),
            selectedRuns: normalizedRuns,
            containerArtifacts: normalizeArtifacts(containerArtifactsPage.artifacts ?? []),
            containerJobs: normalizeJobs(containerJobsPage.jobs ?? []),
            recoveryArtifacts: normalizeArtifacts(recoveryArtifactsPage.artifacts ?? []),
            recoveryJobs: normalizeJobs(recoveryJobsPage.jobs ?? []),
          };

          await mkdir("artifacts/exact-main-run-discovery", { recursive: true });
          await writeFile(
            "artifacts/exact-main-run-discovery/discovery.json",
            `${JSON.stringify(output, null, 2)}\n`,
            "utf8",
          );
          console.log(
            JSON.stringify(
              {
                selectedSha,
                dispatchedRecovery,
                governedRunIds: normalizedRuns.map((entry) => [entry.name, entry.run.id]),
              },
              null,
              2,
            ),
          );
          NODE

      - name: Upload bounded exact-main run discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-main-run-discovery-${{ github.run_id }}
          path: artifacts/exact-main-run-discovery/discovery.json
          if-no-files-found: error
          retention-days: 30
