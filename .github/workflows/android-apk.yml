name: Android APK (test build)

# Builds the Trusted Web Activity wrapper in android/ into a debug-signed
# APK for internal sideload testing — not a Play Store release build (see
# android/app/build.gradle for why). Runs on a GitHub-hosted runner because
# the Android SDK/AGP can only be fetched from Google's Maven repo, which
# this repository's normal CI sandbox cannot reach. Uses the JDK and
# Android SDK ubuntu-latest ships preinstalled rather than a setup action,
# so every `uses:` in this file stays pinned to a full commit SHA like the
# rest of this repository's workflows.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tecpey-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
