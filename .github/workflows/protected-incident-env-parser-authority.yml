name: Protected Incident Env Parser Authority

on:
  pull_request:
    paths:
      - '.github/workflows/protected-staging-incident-readiness-evidence.yml'
      - '.github/workflows/protected-incident-env-parser-authority.yml'
      - 'scripts/check-protected-incident-env-parser-authority.mjs'
      - 'scripts/test-protected-incident-env-parser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: node scripts/check-protected-incident-env-parser-authority.mjs
      - run: node scripts/test-protected-incident-env-parser.mjs
