name: Protected Incident Env Parser Authority

on:
  pull_request:
    paths:
      - '.github/workflows/protected-staging-incident-readiness-evidence.yml'
      - 'scripts/check-protected-incident-env-parser-authority.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check-protected-incident-env-parser-authority.mjs
