name: Next security audit evidence refresh

permissions:
  contents: write

on:
  push:
    branches:
      - codex/next-16.3.8-security-review

concurrency:
  group: next-security-audit-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: codex/next-16.3.8-security-review
          fetch-depth: 0
          persist-credentials: false

      - name: Renew semantic evidence for exact package manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const evidencePath = 'docs/audits/evidence/batch-01a-audit-authority.json';
          const packagePath = 'package.json';
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const entry = evidence.files.find((candidate) => candidate.path === packagePath);
          if (!entry) throw new Error('package.json semantic evidence entry not found');
          const source = fs.readFileSync(packagePath);
          const text = source.toString('utf8');
          const lines = text.endsWith('\n') ? text.split('\n').length - 1 : text.split('\n').length;
          entry.gitObjectId = execFileSync('git', ['hash-object', packagePath], { encoding: 'utf8' }).trim();
          entry.sha256 = crypto.createHash('sha256').update(source).digest('hex');
          entry.lines = lines;
          entry.reviewedRanges = [{ startLine: 1, endLine: lines }];
          const note = '2026-10-02: re-reviewed the complete package manifest after the security-only Next.js upgrade from exact 16.3.3 to exact 16.3.8 in response to the Container Supply Chain rejection of GHSA-vcvr-r3jv-pc5j. The npm 10 generated lockfile remains authoritative; no script, engine, override, release command, vulnerability exception, mutable dependency range, runtime authority, launch approval or deployment path is introduced by this package.json delta.';
          if (!entry.reviewNotes.includes(note)) entry.reviewNotes.push(note);
          evidence.reviewedAt = '2026-10-02';
          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          git diff --check
          node -e "const e=require('./docs/audits/evidence/batch-01a-audit-authority.json'); const x=e.files.find(f=>f.path==='package.json'); if(x.gitObjectId!=='5827124e15e2e5c806741e6753c1e2eb93fad593') process.exit(1)"

      - name: Commit exact evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/audits/evidence/batch-01a-audit-authority.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(security): renew Next.js package review evidence"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/tecpey/Tecpey-Os.git" HEAD:codex/next-16.3.8-security-review
