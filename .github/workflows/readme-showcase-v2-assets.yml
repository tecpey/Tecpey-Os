name: README Showcase V2 Asset Materialization

on:
  push:
    branches:
      - docs/readme-showcase-v2
    paths:
      - .github/workflows/readme-showcase-v2-assets.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: readme-showcase-v2-assets
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download governed browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10385133433/zip > /tmp/public-browser-report.zip
          mkdir -p /tmp/public-browser-report
          unzip -q /tmp/public-browser-report.zip -d /tmp/public-browser-report

      - name: Install pinned image pipeline
        run: python -m pip install --disable-pip-version-check --no-input 'Pillow==12.3.0'

      - name: Materialize high-resolution README derivatives
        run: |
          set -Eeuo pipefail
          python <<'PYTHON'
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/public-browser-report')
          out = Path('docs/assets/screenshots/showcase-v2')
          out.mkdir(parents=True, exist_ok=True)

          assets = [
              ('chromium-en-desktop/data/d36ea02a71bf10ccac8d75651a6d2cfcbdfd5443.png', 'landing-en-9f3a8fa0.webp', None),
              ('firefox-fa-desktop/data/569c18a464a038540040a14206a855639a360b14.png', 'landing-fa-9f3a8fa0.webp', None),
              ('firefox-fa-desktop/data/ac5b6733a4677212ee244f617f0afbc8d47173a8.png', 'academy-fa-9f3a8fa0.webp', 1350),
              ('firefox-fa-desktop/data/9a50aa4cf2bc06e05be47418939524da504a3499.png', 'mentor-fa-9f3a8fa0.webp', 1350),
              ('firefox-fa-desktop/data/ff457a3bc8fdc9b4ec388fdc0e481ddabd4c0789.png', 'arena-fa-9f3a8fa0.webp', 1350),
          ]

          for source, target, crop_height in assets:
              source_path = root / source
              if not source_path.is_file():
                  raise SystemExit(f'Missing governed source capture: {source}')
              with Image.open(source_path) as image:
                  if crop_height is not None:
                      image = image.crop((0, 0, 1440, crop_height))
                  image.save(out / target, 'WEBP', quality=94, method=6)
          PYTHON

      - name: Verify immutable derivative hashes
        run: |
          set -Eeuo pipefail
          cd docs/assets/screenshots/showcase-v2
          printf '%s  %s\n' \
            '0eaa133b8f139a19078c60365115f0cb5e1904e3eb3adb04aac09d720fd6118f' 'landing-en-9f3a8fa0.webp' \
            'c7fc7b8d4b47af50abb62a8bb48b75ea5b2bdb35ad6a9268d31a57488cfafa5a' 'landing-fa-9f3a8fa0.webp' \
            'd9ec660773c5d3b93d2597d3fdaf3f3c36619facb900072b4dc3cb6b21209aaa' 'academy-fa-9f3a8fa0.webp' \
            'bb1ef2e1f8044a5484bc4130142f2ce6ec211b3a9f53f2ea5a0f972a8521d269' 'mentor-fa-9f3a8fa0.webp' \
            '8dd42a7422cfcfba10e7b633517d83c344383d39a1bf45a19c4713628ff97d77' 'arena-fa-9f3a8fa0.webp' \
            | sha256sum --check --strict

      - name: Commit durable assets and retire one-shot materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm .github/workflows/readme-showcase-v2-assets.yml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.fa.md docs/assets/screenshots/showcase-v2 .github/workflows/readme-showcase-v2-assets.yml
          git diff --cached --check
          git commit -m 'docs(showcase): materialize high-resolution governed product captures'
          gh auth setup-git
          git push origin HEAD:docs/readme-showcase-v2
