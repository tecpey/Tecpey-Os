name: API Security Manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-security-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-pr584:
    name: Apply exact PR 584 audited implementation
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 584 && github.event.pull_request.head.ref == 'feat/market-news-footer-enterprise-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: true

      - name: Verify exact transport head and base ancestry
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 8bd866ee811776340623ed0f805c3270ce354cd5 HEAD
          git merge-base --is-ancestor 106d299f4c8ba7b35c8c8f65aa70b5980cb722ea HEAD
          git merge-base --is-ancestor 9904f4774bf4cac3764569648da6c0940afe4591 HEAD
          git merge-base --is-ancestor 1f93f7cb3db0b67085fa0145acf1a93d8225b8a2 HEAD

      - name: Reconstruct authenticated canonical patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tecpey/Tecpey-Os/issues/584/comments?per_page=100" \
            > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/comments.json" "$RUNNER_TEMP/pr584.patch.b64" <<'PY'
          import json, pathlib, sys
          comments = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          markers = [f"<!-- PR584_PATCH_{i:02d} -->" for i in range(1, 8)] + [f"<!-- PR584_FINAL_{i:02d} -->" for i in range(8, 13)]
          chunks = []
          for marker in markers:
              matches = [c for c in comments if c.get("user", {}).get("login") == "tecpey" and str(c.get("body", "")).startswith(marker + "\n")]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one owner-authored {marker}, got {len(matches)}")
              lines = str(matches[0]["body"]).splitlines()
              if len(lines) != 2:
                  raise SystemExit(f"invalid transport shape for {marker}")
              chunk = lines[1].strip()
              if len(chunk) != 7892:
                  raise SystemExit(f"invalid chunk length for {marker}: {len(chunk)}")
              chunks.append(chunk)
          payload = "".join(chunks)
          if len(payload) != 94704:
              raise SystemExit(f"invalid payload length: {len(payload)}")
          pathlib.Path(sys.argv[2]).write_text(payload, encoding="ascii")
          PY
          base64 -d "$RUNNER_TEMP/pr584.patch.b64" | bunzip2 > "$RUNNER_TEMP/pr584.patch"
          echo "22d8b504d416318f95a2b34245853293023a4370fc7f7c8bebaccf98e0527b3b  $RUNNER_TEMP/pr584.patch" | sha256sum -c -

      - name: Restore workflow baseline, remove transport, and apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git show 1f93f7cb3db0b67085fa0145acf1a93d8225b8a2:.github/workflows/api-security-manifest.yml > .github/workflows/api-security-manifest.yml
          git add .github/workflows/api-security-manifest.yml
          git rm .github/workflows/export-branch-source-once.yml
          git rm .github/pr584-patch.part{01..13}
          git apply --check --whitespace=fix "$RUNNER_TEMP/pr584.patch"
          git apply --index --whitespace=fix "$RUNNER_TEMP/pr584.patch"
          test ! -e .github/workflows/export-branch-source-once.yml
          test "$(find .github -maxdepth 1 -name 'pr584-patch.part*' -print | wc -l | tr -d ' ')" = "0"
          git diff --cached --check
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          bash -n scripts/install-news-materialization-scheduler.sh
          bash -n scripts/install-organic-growth-trend-scheduler.sh
          bash -n scripts/create-support-deployment-bundle.sh
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -ge 40

      - name: Commit and push exact product implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(growth): build market news organic growth operating system"
          git push origin HEAD:feat/market-news-footer-enterprise-v1

  policy:
    name: Mutating API Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify npm version
        run: |
          NPM_MAJOR=$(npm --version | cut -d. -f1)
          if [ "$NPM_MAJOR" != "10" ]; then
            echo "ERROR: npm major version must be 10. Got: $(npm --version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Verify exact manifest and governed exceptions
        id: manifest-policy
        shell: bash
        run: |
          mkdir -p artifacts/api-security-manifest
          set +e
          npm run api:security:check 2>&1 | tee artifacts/api-security-manifest/check.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Run manifest policy and response-cache tests
        if: ${{ always() }}
        run: npm run test:api-security-manifest

      - name: Generate exact diagnostic manifest
        if: ${{ failure() }}
        run: |
          node scripts/generate-api-security-manifest.mjs --output=artifacts/api-security-manifest/api-security-manifest.diagnostic.json
          node scripts/postprocess-api-security-manifest.mjs --manifest=artifacts/api-security-manifest/api-security-manifest.diagnostic.json
          node scripts/apply-api-security-operation-overrides.mjs --manifest=artifacts/api-security-manifest/api-security-manifest.diagnostic.json

      - name: Upload manifest diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-security-manifest-diagnostics-${{ github.sha }}
          path: artifacts/api-security-manifest/**
          if-no-files-found: error
          retention-days: 7
