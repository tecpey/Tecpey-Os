name: Apply PR 584 implementation once

on:
  push:
    branches:
      - feat/market-news-footer-enterprise-v1
    paths:
      - .github/workflows/export-branch-source-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact transport lineage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/market-news-footer-enterprise-v1
          fetch-depth: 30
          persist-credentials: true

      - name: Verify exact transport lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "92100d5a3153bd79004ca5c9b58d97b19953d453"
          test "$(git rev-parse HEAD^^)" = "93872e7438977842654cb96b4f7311846286d8b5"
          git merge-base --is-ancestor 9904f4774bf4cac3764569648da6c0940afe4591 HEAD
          test "$(git rev-list --count 9904f4774bf4cac3764569648da6c0940afe4591..93872e7438977842654cb96b4f7311846286d8b5)" = "14"

      - name: Reconstruct and verify audited patch
        shell: bash
        run: |
          set -Eeuo pipefail
          for part in $(seq -w 1 13); do
            test -s ".github/pr584-patch.part${part}"
          done
          cat .github/pr584-patch.part{01..13} > "$RUNNER_TEMP/pr584.patch"
          echo "22d8b504d416318f95a2b34245853293023a4370fc7f7c8bebaccf98e0527b3b  $RUNNER_TEMP/pr584.patch" | sha256sum -c -

      - name: Apply product patch and remove transport
        shell: bash
        run: |
          set -Eeuo pipefail
          git show 93872e7438977842654cb96b4f7311846286d8b5:.github/workflows/export-branch-source-once.yml > .github/workflows/export-branch-source-once.yml
          git add .github/workflows/export-branch-source-once.yml
          git rm .github/pr584-patch.part{01..13}
          git apply --check "$RUNNER_TEMP/pr584.patch"
          git apply --index "$RUNNER_TEMP/pr584.patch"
          test ! -e .github/workflows/export-branch-source-once.yml
          test "$(find .github -maxdepth 1 -name 'pr584-patch.part*' -print | wc -l | tr -d ' ')" = "0"
          git diff --cached --check
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          bash -n scripts/install-news-materialization-scheduler.sh
          bash -n scripts/install-organic-growth-trend-scheduler.sh
          bash -n scripts/create-support-deployment-bundle.sh
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -ge 40

      - name: Commit exact implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(growth): build market news organic growth operating system"
          git push origin HEAD:feat/market-news-footer-enterprise-v1
