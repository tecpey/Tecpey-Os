name: Export Branch Source Once

on:
  push:
    branches:
      - feat/market-news-footer-enterprise-v1
    paths:
      - .github/workflows/export-branch-source-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/market-news-footer-enterprise-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Archive source with local git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "$RUNNER_TEMP/tecpey-source.tgz" .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tecpey-source-${{ github.sha }}
          path: ${{ runner.temp }}/tecpey-source.tgz
          if-no-files-found: error
          retention-days: 1
