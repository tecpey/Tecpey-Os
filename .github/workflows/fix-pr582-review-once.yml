name: Fix PR 582 Review Once

on:
  push:
    branches:
      - agent/promote-main-5e65-evidence
    paths:
      - .github/workflows/fix-pr582-review-once.yml

permissions:
  contents: write

concurrency:
  group: fix-pr582-review-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/promote-main-5e65-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Correct promoted RTO sample and remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/launch/PROTECTED_STAGING_EVIDENCE_PACKET_20260810.md')
          text = path.read_text()
          old = '| RTO sample | synthetic CI recovery completed in `5123ms` under the `300s` maximum |'
          new = '| RTO sample | synthetic CI recovery completed in `9691ms` under the `300s` maximum |'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale RTO row, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-pr582-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/launch/PROTECTED_STAGING_EVIDENCE_PACKET_20260810.md
          git diff --cached --check
          git commit -m 'docs(launch): align promoted rollback RTO evidence'
          git push origin HEAD:agent/promote-main-5e65-evidence
