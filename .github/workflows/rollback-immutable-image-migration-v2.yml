name: Rollback immutable-image migration v2

permissions:
  contents: write

on:
  push:
    branches:
      - codex/supply-chain-openssl-3.5.9

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: codex/supply-chain-openssl-3.5.9
          fetch-depth: 0
          persist-credentials: false

      - name: Rewrite recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, textwrap

          workflow_path = Path('.github/workflows/container-supply-chain.yml')
          workflow = workflow_path.read_text()
          header = "  recovery:\n    name: Ephemeral staging rollback and volume restore\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n"
          if header not in workflow:
              raise SystemExit('recovery header missing')
          workflow = workflow.replace(header, header + "    permissions:\n      contents: read\n      packages: read\n", 1)

          start = workflow.index('      - name: Checkout exact previous release\n')
          end = workflow.index('      - name: Restore PostgreSQL and Redis persistent volumes\n', start)
          dollar = '$'
          head_expr = dollar + '{{ github.event.pull_request.head.sha || github.sha }}'
          prev_expr = dollar + '{{ github.event.pull_request.base.sha || github.event.before }}'
          actor_expr = dollar + '{{ github.actor }}'
          token_expr = dollar + '{{ secrets.GITHUB_TOKEN }}'
          new_block = textwrap.dedent(f'''\
                - name: Authenticate to GHCR for rollback artifact
                  uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
                  with:
                    registry: ghcr.io
                    username: {actor_expr}
                    password: {token_expr}

                - name: Pull and verify exact previous release image
                  env:
                    CANDIDATE_SHA: {head_expr}
                    PREVIOUS_SHA: {prev_expr}
                  run: |
                    set -euo pipefail
                    mkdir -p artifacts/container-recovery
                    previous_tag="ghcr.io/tecpey/tecpey-os:$PREVIOUS_SHA"
                    docker pull "$previous_tag"
                    previous_digest="$(docker image inspect --format '{{{{index .RepoDigests 0}}}}' "$previous_tag")"
                    printf '%s\\n' "$previous_digest" | grep -Eq '^ghcr\\.io/tecpey/tecpey-os@sha256:[0-9a-f]{{64}}$'
                    baked_commit="$(docker run --rm --entrypoint node "$previous_digest" -e "const x=require('./.next/required-server-files.json'); process.stdout.write(String(x.config?.env?.TECPEY_IMMUTABLE_BUILD_COMMIT_SHA ?? ''))")"
                    test "$baked_commit" = "$PREVIOUS_SHA"
                    printf '%s\\n' "$previous_digest" > artifacts/container-recovery/previous-image-digest.txt
                    printf '%s\\n' "$baked_commit" > artifacts/container-recovery/previous-baked-commit.txt
                    docker tag "$previous_digest" "tecpey-previous:$PREVIOUS_SHA"
                    bash scripts/test-container-image-rollback.sh "tecpey-candidate:$CANDIDATE_SHA" "tecpey-previous:$PREVIOUS_SHA"

          ''')
          # Restore workflow indentation removed by dedent.
          new_block = ''.join(('      ' + line if line.strip() else line) for line in new_block.splitlines(True))
          workflow = workflow[:start] + new_block + workflow[end:]
          if 'docker build --build-arg "TECPEY_BUILD_COMMIT_SHA=$PREVIOUS_SHA"' in workflow:
              raise SystemExit('historic source rebuild survived')
          workflow_path.write_text(workflow)

          for file_name in ('scripts/check-production-supply-chain.mjs', 'scripts/production-host-supply-chain-policy.mjs'):
              path = Path(file_name)
              source = path.read_text()
              old = "    'TECPEY_BUILD_COMMIT_SHA=$PREVIOUS_SHA',\n"
              if old not in source:
                  raise SystemExit(f'{file_name}: previous build authority missing')
              source = source.replace(old, "    'ghcr.io/tecpey/tecpey-os:$PREVIOUS_SHA',\n    'previous-image-digest.txt',\n    'previous-baked-commit.txt',\n", 1)
              path.write_text(source)

          policy_path = Path('scripts/production-host-supply-chain-policy.mjs')
          policy = policy_path.read_text()
          anchor = '  const publishJob = yamlBlock(containerWorkflow, 2, "publish");'
          authority = textwrap.dedent('''\
            const recoveryJob = yamlBlock(containerWorkflow, 2, "recovery");
            for (const contract of [
              "packages: read",
              "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
              'ghcr.io/tecpey/tecpey-os:$PREVIOUS_SHA',
              "previous-image-digest.txt",
              "previous-baked-commit.txt",
              "TECPEY_IMMUTABLE_BUILD_COMMIT_SHA",
            ]) {
              requireText(
                findings,
                recoveryJob,
                contract,
                `Container recovery must use and verify the immutable previous image: ${contract}`,
              );
            }
            reject(
              findings,
              recoveryJob,
              /docker build[^\\n]*PREVIOUS_SHA|previous-release\\s*$/m,
              "Container recovery must not reconstruct a historical release from mutable package repositories",
            );
          ''')
          if anchor not in policy:
              raise SystemExit('policy anchor missing')
          policy = policy.replace(anchor, authority + anchor, 1)
          policy_path.write_text(policy)

          tests_path = Path('scripts/production-host-supply-chain-policy.test.mjs')
          tests = tests_path.read_text()
          test_anchor = 'test("published images bake public configuration and Compose validates before startup", () => {'
          recovery_test = textwrap.dedent('''\
            test("recovery uses immutable previous image identity and rejects source reconstruction", () => {
              const missingDigestProof = {
                ...sources,
                containerWorkflow: sources.containerWorkflow.replace("previous-image-digest.txt", "previous-image-ref.txt"),
              };
              assert.match(
                productionHostSupplyChainFindings(missingDigestProof).join("\\n"),
                /immutable previous image/,
              );

              const sourceRebuild = {
                ...sources,
                containerWorkflow: sources.containerWorkflow.replace(
                  'docker pull "$previous_tag"',
                  'docker build --build-arg "TECPEY_BUILD_COMMIT_SHA=$PREVIOUS_SHA" --target runner previous-release',
                ),
              };
              assert.match(
                productionHostSupplyChainFindings(sourceRebuild).join("\\n"),
                /must not reconstruct a historical release/,
              );
            });

          ''')
          if test_anchor not in tests:
              raise SystemExit('test anchor missing')
          tests_path.write_text(tests.replace(test_anchor, recovery_test + test_anchor, 1))

          deployment_path = Path('docs/operations/PRODUCTION_DEPLOYMENT_CONTRACT.md')
          deployment = deployment_path.read_text()
          old_doc = 'On pull requests it also builds the candidate and exact base release images,\nserves the candidate, replaces it with the previous image on the same endpoint,'
          new_doc = 'On pull requests it builds the candidate, resolves the exact base-release image from GHCR, verifies its registry digest and artifact-baked commit identity,\nserves the candidate, replaces it with that immutable previous image on the same endpoint,'
          if old_doc not in deployment:
              raise SystemExit('deployment contract text missing')
          deployment_path.write_text(deployment.replace(old_doc, new_doc, 1))

          reviewed = [
              str(workflow_path),
              'scripts/check-production-supply-chain.mjs',
              str(policy_path),
              str(tests_path),
              str(deployment_path),
          ]
          note = ('2026-10-02: re-reviewed after replacing historical-source rollback reconstruction with authenticated immutable GHCR previous-image retrieval, registry-digest capture and artifact-baked commit verification. The recovery path fails closed if the prior release artifact is absent or identity-mismatched and does not weaken candidate build, SBOM, vulnerability, volume-restore or rollback evidence requirements.')
          for evidence_name in ('docs/audits/evidence/batch-01a-audit-authority.json', 'docs/audits/evidence/batch-01b-operational-workflows.json'):
              evidence_path = Path(evidence_name)
              evidence = json.loads(evidence_path.read_text())
              changed = False
              for reviewed_path in reviewed:
                  entry = next((x for x in evidence.get('files', []) if x.get('path') == reviewed_path), None)
                  if not entry:
                      continue
                  data = Path(reviewed_path).read_bytes()
                  text = data.decode()
                  lines = len(text.splitlines())
                  entry['gitObjectId'] = subprocess.check_output(['git', 'hash-object', reviewed_path], text=True).strip()
                  entry['sha256'] = hashlib.sha256(data).hexdigest()
                  entry['lines'] = lines
                  entry['reviewedRanges'] = [{'startLine': 1, 'endLine': lines}]
                  if note not in entry.get('reviewNotes', []):
                      entry.setdefault('reviewNotes', []).append(note)
                  changed = True
              if changed:
                  evidence['reviewedAt'] = '2026-10-02'
                  evidence_path.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          git diff --check

      - name: Verify policy before commit
        run: |
          node scripts/check-production-supply-chain.mjs
          node --test scripts/production-host-supply-chain-policy.test.mjs

      - name: Commit migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/container-supply-chain.yml scripts/check-production-supply-chain.mjs scripts/production-host-supply-chain-policy.mjs scripts/production-host-supply-chain-policy.test.mjs docs/operations/PRODUCTION_DEPLOYMENT_CONTRACT.md docs/audits/evidence/batch-01a-audit-authority.json docs/audits/evidence/batch-01b-operational-workflows.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(recovery): use immutable previous release image"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/tecpey/Tecpey-Os.git" HEAD:codex/supply-chain-openssl-3.5.9
