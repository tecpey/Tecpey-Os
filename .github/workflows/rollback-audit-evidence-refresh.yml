name: Rollback audit evidence refresh

permissions:
  contents: write

on:
  push:
    branches:
      - codex/supply-chain-openssl-3.5.9

concurrency:
  group: rollback-audit-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: codex/supply-chain-openssl-3.5.9
          fetch-depth: 0
          persist-credentials: false

      - name: Renew exact semantic review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const evidencePath = 'docs/audits/evidence/batch-01b-operational-workflows.json';
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const note = '2026-10-02: re-reviewed after replacing historical-source rollback reconstruction with authenticated immutable GHCR retrieval of the exact base-release image, registry-digest capture, artifact-baked commit verification, digest-bound rollback consumption and a dedicated negative guard that rejects source reconstruction and mutable latest/main rollback tags. The candidate build, SBOM, HIGH/CRITICAL vulnerability rejection, volume-restore evidence and publication dependency remain fail-closed.';
          function bind(path, create = false) {
            let entry = evidence.files.find((candidate) => candidate.path === path);
            if (!entry && create) {
              entry = {
                path,
                gitObjectId: '',
                sha256: '',
                lines: 0,
                reviewedRanges: [],
                findingDisposition: 'no-confirmed-findings',
                reviewNotes: [],
                findings: [],
              };
              evidence.files.push(entry);
            }
            if (!entry) throw new Error(`semantic evidence entry not found: ${path}`);
            const bytes = fs.readFileSync(path);
            const text = bytes.toString('utf8');
            const lines = text.endsWith('\n') ? text.split('\n').length - 1 : text.split('\n').length;
            entry.gitObjectId = execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
            entry.sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            entry.lines = lines;
            entry.reviewedRanges = [{ startLine: 1, endLine: lines }];
            if (!entry.reviewNotes.includes(note)) entry.reviewNotes.push(note);
          }
          bind('.github/workflows/container-supply-chain.yml');
          bind('scripts/check-container-rollback-artifact.mjs', true);
          evidence.reviewedAt = '2026-10-02';
          evidence.reviewMethod = evidence.reviewMethod.replace('five Batch 1 operational workflow and production supply-chain authority files', 'six Batch 1 operational workflow and production supply-chain authority files');
          for (const risk of evidence.residualRisks ?? []) {
            if (risk.id === 'B01B-RISK-001') risk.statement = risk.statement.replace('five repository-supply-chain files', 'six repository-supply-chain files');
          }
          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          git diff --check

      - name: Commit exact evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/audits/evidence/batch-01b-operational-workflows.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(recovery): bind immutable rollback review evidence"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/tecpey/Tecpey-Os.git" HEAD:codex/supply-chain-openssl-3.5.9
