name: Temporary lockfile refresh
on:
  push:
    branches: [fix/recover-supply-chain-current-main]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'refresh lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: fix/recover-supply-chain-current-main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git commit -m "chore(security): refresh lockfile for supply-chain remediation"
          git push origin HEAD:fix/recover-supply-chain-current-main
