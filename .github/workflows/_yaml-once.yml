name: Temporary final workflow digest
on:
  push:
    branches: [fix/recover-supply-chain-current-main]
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: fix/recover-supply-chain-current-main
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import hashlib,re
          p='.github/workflows/container-supply-chain.yml'
          s=open(p).read()
          s=re.sub(r'  pull_request:\n    branches: \[main\]\n    paths:\n(?:      - .*\n)+', '  pull_request:\n    branches: [main]\n', s, count=1)
          open('/tmp/final-workflow.yml','w').write(s)
          print(hashlib.sha256(s.encode()).hexdigest())
          print('lines='+str(len(s.splitlines())))
          PY
