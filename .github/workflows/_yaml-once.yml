name: Temporary final yaml validation
on:
  push:
    branches: [fix/recover-supply-chain-current-main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: fix/recover-supply-chain-current-main
          persist-credentials: false
      - run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/container-supply-chain.yml"); puts "YAML_OK"'
