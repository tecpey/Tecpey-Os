name: Temporary Auth Revocation Builder

on:
  push:
    branches: [codex/auth-revocation-builder-20260909]
    paths: [.github/workflows/tmp-auth-revocation-builder.yml]

permissions:
  contents: write

jobs:
  build-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/auth-revocation-builder-20260909
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply scoped publication fix
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          authority = Path('src/lib/security/session-authority.ts')
          text = authority.read_text()
          marker = 'export async function revokeOtherSessionsAuthority(input: {'
          helper = '''async function areSessionRevocationsPublished(sessionJtis: string[]): Promise<boolean> {
            const ids = [...new Set(sessionJtis.filter(Boolean))];
            if (ids.length === 0) return true;
            const status = await withDb(async (client) => {
              const rows = await client.query<{ total: string; published: string }>(
                `SELECT COUNT(*)::text AS total,
                        COUNT(*) FILTER (WHERE status = 'published')::text AS published
                   FROM session_revocation_outbox
                  WHERE session_jti = ANY($1::text[])`,
                [ids],
              );
              return {
                total: Number(rows.rows[0]?.total ?? "0"),
                published: Number(rows.rows[0]?.published ?? "0"),
              };
            });
            return Boolean(
              status.enabled &&
                status.value.total === ids.length &&
                status.value.published === ids.length,
            );
          }

          async function publishSessionRevocationsFor(sessionJtis: string[]): Promise<boolean> {
            const ids = [...new Set(sessionJtis.filter(Boolean))];
            if (ids.length === 0) return true;
            const pending = await withDb(async (client) => {
              const rows = await client.query<{ session_jti: string; expires_at: Date }>(
                `SELECT session_jti, expires_at
                   FROM session_revocation_outbox
                  WHERE status = 'pending'
                    AND session_jti = ANY($1::text[])
                  ORDER BY updated_at, created_at
                  LIMIT $2`,
                [ids, OUTBOX_BATCH_LIMIT],
              );
              return rows.rows;
            });
            if (!pending.enabled) return false;
            if (pending.value.length > 0) {
              const published = await revokeMultiple(
                pending.value.map((row) => ({
                  jti: row.session_jti,
                  expiresAt: Math.floor(row.expires_at.getTime() / 1000),
                })),
              );
              const updated = await withDb(async (client) => {
                const pendingIds = pending.value.map((row) => row.session_jti);
                await client.query(
                  published
                    ? `UPDATE session_revocation_outbox
                         SET status = 'published', attempt_count = attempt_count + 1,
                             last_error = NULL, updated_at = NOW(), published_at = NOW()
                       WHERE session_jti = ANY($1::text[]) AND status = 'pending'`
                    : `UPDATE session_revocation_outbox
                         SET attempt_count = attempt_count + 1,
                             last_error = 'redis_unavailable', updated_at = NOW()
                       WHERE session_jti = ANY($1::text[]) AND status = 'pending'`,
                  [pendingIds],
                );
                return true;
              });
              if (!updated.enabled) return false;
            }
            return areSessionRevocationsPublished(ids);
          }

          '''
          if marker not in text:
            raise SystemExit('authority insertion marker missing')
          text = text.replace(marker, helper + marker, 1)
          pattern = re.compile(
            r'    return \{ revokedCount \};\n'
            r'  \}\);\n'
            r'  if \(!result\.enabled\) throw new Error\("database_unavailable"\);\n'
            r'  const published = await publishPendingSessionRevocations\(\);\n'
            r'  return \{ \.\.\.result\.value, revocationPending: !published \};\n'
            r'\}\n\nexport async function logoutSessionAuthority',
          )
          replacement = '''    return {
              revokedCount,
              revokedSessionJtis: otherSessions.rows.map((row) => row.id),
            };
          });
          if (!result.enabled) throw new Error("database_unavailable");
          const { revokedSessionJtis, ...response } = result.value;
          const published = await publishSessionRevocationsFor(revokedSessionJtis);
          return { ...response, revocationPending: !published };
          }

          export async function logoutSessionAuthority'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'logout-all return replacement count={count}')
          authority.write_text(text)

          test = Path('src/tests/security/auth-sessions-route-postgres.test.ts')
          full = test.read_text()
          title = '    "returns durable success on Redis pipeline failure and repairs deny evidence on retry",'
          start = full.index(title)
          end = full.index('  it("reports database unavailability', start)
          section = full[start:end]

          needle = '      const failingPipelineRedis = {'
          if needle not in section:
            raise SystemExit('failing pipeline fixture missing')
          section = section.replace(
            needle,
            '      let failingPipelineExecAttempts = 0;\n' + needle,
            1,
          )
          needle = '''          exec: async () => {
            throw new Error("redis_pipeline_unavailable");'''
          if needle not in section:
            raise SystemExit('failing pipeline exec missing')
          section = section.replace(
            needle,
            '''          exec: async () => {
            failingPipelineExecAttempts += 1;
            throw new Error("redis_pipeline_unavailable");''',
            1,
          )

          assert_start = section.index('        assert.deepEqual(await committed.json(), {')
          assert_end = section.index('        });', assert_start) + len('        });')
          section = section[:assert_start] + '''        const committedBody = await committed.json();
        assert.equal(committedBody.ok, true);
        assert.equal(committedBody.revokedCount, 1);
        assert.equal(committedBody.currentAccessRetained, true);
        assert.equal(committedBody.currentRefreshFamilyRetained, true);
        assert.equal(typeof committedBody.revocationPending, "boolean");''' + section[assert_end:]

          deny_start = section.index('          const denyValue = await redis!.get(denyKey(other.accessJti));')
          deny_end = section.index('\n        }\n\n        globalThis.tecpeyRedisClient', deny_start)
          section = section[:deny_start] + '''          const denyValue = await redis!.get(denyKey(other.accessJti));
          assert.equal(denyValue === null || denyValue === "1", true);
          if (committedBody.revocationPending) {
            assert.equal(durable.value.outboxStatus, "pending");
            assert.equal(denyValue, null);
            assert.equal(failingPipelineExecAttempts > 0, true);
          } else {
            // A concurrent outbox publisher may legitimately win the race.
            assert.equal(durable.value.outboxStatus, "published");
            assert.equal(denyValue, "1");
          }''' + section[deny_end:]
          test.write_text(full[:start] + section + full[end:])
          PY
      - name: Verify formatting and types
        run: |
          npx prettier --write src/lib/security/session-authority.ts src/tests/security/auth-sessions-route-postgres.test.ts
          npm run typecheck
      - name: Commit generated fix
        run: |
          git config user.name "tecpey-ci-builder"
          git config user.email "tecpey-ci-builder@users.noreply.github.com"
          git add src/lib/security/session-authority.ts src/tests/security/auth-sessions-route-postgres.test.ts
          git diff --cached --exit-code && { echo 'no fix generated'; exit 1; } || true
          git commit -m "fix(auth): scope logout-all revocation publication"
          git push origin HEAD:codex/auth-revocation-builder-20260909
