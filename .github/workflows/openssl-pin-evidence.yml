name: OpenSSL Pin Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/openssl-pin-evidence.yml
      - scripts/production-host-supply-chain-policy.mjs

permissions:
  contents: read

jobs:
  evidence:
    name: Exact OpenSSL policy evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Generate immutable policy evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const path = 'scripts/production-host-supply-chain-policy.mjs';
          const content = fs.readFileSync(path);
          const text = content.toString('utf8');
          const evidence = {
            path,
            headSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            gitObjectId: execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(),
            sha256: crypto.createHash('sha256').update(content).digest('hex'),
            lines: text.length === 0 ? 0 : (text.match(/\r\n|\r|\n/g)?.length ?? 0) + (/(?:\r\n|\r|\n)$/.test(text) ? 0 : 1),
          };
          fs.mkdirSync('artifacts/openssl-pin-evidence', { recursive: true });
          fs.writeFileSync('artifacts/openssl-pin-evidence/policy.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable policy evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openssl-pin-policy-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/openssl-pin-evidence/policy.json
          if-no-files-found: error
          retention-days: 1
