<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06111f">
    <meta name="robots" content="noindex,nofollow">
    <title>آکادمی تک‌پی آفلاین است</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); color: #f8fafc; background: radial-gradient(circle at top, rgba(34, 211, 238, .18), transparent 38%), #020617; }
      main { width: min(100%, 560px); padding: 30px; border: 1px solid rgba(103, 232, 249, .24); border-radius: 32px; background: rgba(15, 23, 42, .82); box-shadow: 0 32px 100px rgba(8, 145, 178, .16); }
      .mark { display: grid; width: 64px; height: 64px; place-items: center; border: 1px solid rgba(103, 232, 249, .3); border-radius: 22px; color: #67e8f9; background: rgba(8, 145, 178, .14); font-size: 25px; font-weight: 900; }
      .eyebrow { margin: 24px 0 0; color: #67e8f9; font-size: 13px; font-weight: 800; }
      h1 { margin: 10px 0 0; font-size: clamp(28px, 8vw, 42px); line-height: 1.35; }
      p { margin: 18px 0 0; color: #cbd5e1; font-size: 16px; line-height: 2; }
      .safety { margin-top: 22px; padding: 16px; border: 1px solid rgba(52, 211, 153, .2); border-radius: 20px; color: #d1fae5; background: rgba(6, 78, 59, .18); font-size: 14px; line-height: 1.9; }
      a { display: block; margin-top: 24px; padding: 15px 18px; border-radius: 18px; color: #042f2e; background: linear-gradient(135deg, #67e8f9, #22d3ee); font-weight: 900; text-align: center; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">TP</div>
      <p class="eyebrow">حالت امن آفلاین</p>
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>برای دریافت آخرین وضعیت حساب و ادامه مسیر آکادمی، اتصال اینترنت را دوباره برقرار کنید.</p>
      <div class="safety">هیچ فرم ورود، ثبت‌نام یا اطلاعات حساب از حافظه قدیمی نمایش داده نشده است.</div>
      <a href="/academy">تلاش دوباره</a>
    </main>
  </body>
</html>
